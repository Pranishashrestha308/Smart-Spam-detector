
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Smart Spam Detector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .logo {
            text-align: center;
            color: #172554;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .message {
            color: #dc2626;
            background: #fee2e2;
            text-align: center;
            padding: 10px;
            border-radius: 7px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #1e40af;
        }

        .back-button {
            display: block;
            text-align: center;
            background: #eff6ff;
            color: #1e40af;
            padding: 13px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #dbeafe;
        }

        @media (max-width: 450px) {
            .container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Smart Spam Detector</div>

    <h2>Reset Password</h2>

    <p class="subtitle">
        Create a new password for your account.
    </p>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="password"
            name="new_password"
            placeholder="New Password"
            minlength="8"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            minlength="8"
            required
        >

        <button type="submit">Reset Password</button>

    </form>

    <a href="/login" class="back-button">
        Back to Login
    </a>

</div>

</body>
</html>
