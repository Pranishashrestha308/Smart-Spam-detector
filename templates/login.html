
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Spam Detector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .logo {
            text-align: center;
            color: #172554;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .message {
            color: #dc2626;
            background: #fee2e2;
            text-align: center;
            padding: 10px;
            border-radius: 7px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 9px 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #172554;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
        }

        button:hover {
            background: #1e40af;
        }

        .extra-links {
            text-align: center;
            margin-top: 22px;
        }

        .link-button {
            display: block;
            background: #eff6ff;
            color: #1e40af;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .link-button:hover {
            background: #dbeafe;
        }

        .extra-links p {
            color: #64748b;
            font-size: 14px;
        }

        .extra-links p a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .extra-links p a:hover {
            text-decoration: underline;
        }

        @media (max-width: 450px) {
            .container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Smart Spam Detector</div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">
        Login to continue to your account.
    </p>

    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div class="extra-links">

        <a href="/forgot_password" class="link-button">
            Forgot Password?
        </a>

        <p>
            Don't have an account?
            <a href="/register">Register Here</a>
        </p>

    </div>

</div>

</body>
</html>
